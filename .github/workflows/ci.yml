name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: OpenAPI lint
        run: make lint-openapi

      - name: Check generated HTTP code
        run: |
          make generate-http
          test -z "$(git status --porcelain -- internal/rest/generated/)"

      - name: Check generated mocks
        run: |
          make generate-mocks
          test -z "$(git status --porcelain -- internal/threat/rest/mocks/)"

      - name: Build
        run: go build ./...

      - name: Go lint
        run: make lint

      - name: Test coverage
        run: make test-cover
