openapi: 3.0.0
info:
  title: Information Exchange Service
  description: API для обмена информацией об угрозах.
  version: 1.2.1

paths:
  /info/{md5}:
    parameters:
      - name: md5
        in: path
        required: true
        description: MD5-хеш файла (32 символа, шестнадцатеричные цифры)
        schema:
          $ref: '#/components/schemas/MD5'
    get:
      summary: Получить информацию об угрозе по MD5
      description: Возвращает полную информацию об угрозе для указанного MD5-хеша.
      operationId: getInfoByMd5
      responses:
        '200':
          description: Успешный ответ с информацией об угрозе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Threat'
        '404':
          description: Угроза с указанным MD5 не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Некорректный формат MD5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Обновить информацию об угрозе по MD5
      description: Заменяет информацию о существующей угрозе
      operationId: updateThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatData'
      responses:
        '200':
          description: Информация успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Threat'
        '400':
          description: Некорректные данные запроса или MD5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Угроза с указанным MD5 не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /info:
    post:
      summary: Создать новую запись об угрозе
      description: Добавляет новую информацию об угрозе. MD5 должен быть уникальным.
      operationId: createThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Threat'
      responses:
        '201':
          description: Запись успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Threat'
        '400':
          description: Некорректные данные запроса (например, невалидный MD5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Угроза с таким MD5 уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  responses:
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Threat:
      description: Сведения об угрозе
      allOf:
        - $ref: '#/components/schemas/ThreatData'
        - type: object
          required:
            - md5
          properties:
            md5:
              $ref: '#/components/schemas/MD5'

    ThreatData:
      type: object
      description: Изменяемые сведения об угрозе
      required:
        - name
      properties:
        name:
          type: string
          description: Название угрозы
          example: "Trojan.Win32.Generic"
        description:
          type: string
          maxLength: 4096
          default: ''
          description: Описание поведения и особенностей угрозы
          example: "Собирает учётные данные и передаёт их злоумышленнику."
        malware_types:
          type: array
          description: >-
            Категории угрозы из поддерживаемого поднабора словаря malware-type-ov
            стандарта STIX 2.1. Пустой массив или отсутствие поля означает,
            что категории не указаны.
          uniqueItems: true
          default: []
          items:
            type: string
            enum:
              - backdoor
              - ransomware
              - spyware
              - trojan
              - virus
              - worm
          example: [trojan, spyware]
        confidence:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: >-
            Уверенность автора в достоверности сведений. Отсутствие поля означает,
            что оценка не дана.
          example: 85

    MD5:
      type: string
      pattern: '^[a-fA-F0-9]{32}$'
      description: MD5-хеш файла (32 шестнадцатеричных символа)
      example: "d41d8cd98f00b204e9800998ecf8427e"

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Человекочитаемое описание ошибки
          example: "Threat not found"
        details:
          type: string
          description: Дополнительная информация
          example: "No threat with MD5 d41d8cd98f00b204e9800998ecf8427e found"
