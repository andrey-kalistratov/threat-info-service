services:
  db:
    image: postgres:18.1-alpine3.22
    environment:
      POSTGRES_DB: ${DB_POSTGRES_DATABASE:?DB_POSTGRES_DATABASE is required}
      POSTGRES_USER: ${DB_POSTGRES_USER:?DB_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD:?DB_POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.goose
    environment:
      PGDATABASE: ${DB_POSTGRES_DATABASE:?DB_POSTGRES_DATABASE is required}
      PGUSER: ${DB_POSTGRES_USER:?DB_POSTGRES_USER is required}
      PGPASSWORD: ${DB_POSTGRES_PASSWORD:?DB_POSTGRES_PASSWORD is required}
      PGSSLMODE: ${DB_POSTGRES_SSLMODE:?DB_POSTGRES_SSLMODE is required}
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=db port=5432
      GOOSE_MIGRATION_DIR: /migrations
    volumes:
      - ../migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["up"]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      DB_POSTGRES_HOST: db
      DB_POSTGRES_PORT: 5432
      DB_POSTGRES_DATABASE: ${DB_POSTGRES_DATABASE:?DB_POSTGRES_DATABASE is required}
      DB_POSTGRES_USER: ${DB_POSTGRES_USER:?DB_POSTGRES_USER is required}
      DB_POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD:?DB_POSTGRES_PASSWORD is required}
      DB_POSTGRES_SSLMODE: ${DB_POSTGRES_SSLMODE:?DB_POSTGRES_SSLMODE is required}
      HTTP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
